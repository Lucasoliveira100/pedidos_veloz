apiVersion: v1
kind: Namespace
metadata:
  name: pedidos-veloz
  labels:
    # Pod Security Admission - perfil restricted no namespace inteiro.
    # Bloqueia pods rodando como root, com hostPath, sem seccomp, etc.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
