apiVersion: apps/v1
kind: Deployment
metadata:
  name: estoque-svc
  namespace: pedidos-veloz
  labels: { app: estoque-svc }
spec:
  replicas: 2
  selector:
    matchLabels: { app: estoque-svc }
  template:
    metadata:
      labels: { app: estoque-svc }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: estoque-svc
          image: registry.velozretail.com/pedidos-veloz/estoque:latest
          ports: [{ containerPort: 8083 }]
          envFrom:
            - configMapRef: { name: veloz-config }

          env:
            - { name: PORTA, value: "8083" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /readyz, port: 8083 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8083 }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: estoque-svc
  namespace: pedidos-veloz
spec:
  selector: { app: estoque-svc }
  ports: [{ port: 8083, targetPort: 8083 }]
